# Production-style stack: PostgreSQL + ThumbsUp Email API.
#   1. Create .env (copy .env.example) and set ENVIRONMENT=production, COOKIE_SECURE=true,
#      PUBLIC_BASE_URL=https://..., DASHBOARD_ORIGINS=https://..., provider settings, JWT_SECRET.
#   2. Set POSTGRES_PASSWORD in your shell or in a .env next to this file.
#   3. docker compose up -d --build
# Put an HTTPS reverse proxy (Caddy, Nginx, a cloud load balancer) in front of port 8001.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thumbsup
      POSTGRES_DB: thumbsup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thumbsup"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://thumbsup:${POSTGRES_PASSWORD}@db:5432/thumbsup
    ports:
      - "8001:8001"
    volumes:
      - files:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  files:
