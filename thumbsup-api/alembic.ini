# Database migrations for ThumbsUp Email.
# The server runs "upgrade head" automatically at startup.
# Manual use:  alembic upgrade head        (apply)
#              alembic revision --autogenerate -m "describe change"   (after editing models.py)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
